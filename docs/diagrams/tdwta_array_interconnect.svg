<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Four signal neurons and one timeout neuron with shared buses</title>
  <desc id="desc">Simple array view with five horizontal neuron rows and three clearly separated shared buses.</desc>
  <defs><style>
    .bg{fill:#fff}.cell{fill:#f8fafc;stroke:#293b50;stroke-width:3}.timeout{fill:#fff8e8;stroke:#b87918;stroke-width:3}.shared{fill:#f6f2ff;stroke:#6c55a1;stroke-width:3}
    .wire{fill:none;stroke:#26364a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.sig{stroke:#0d8268}.req{stroke:#c2511d}.rst{stroke:#2469b2}.bias{stroke:#7450a4}
    .title{font:bold 42px 'DejaVu Sans',Arial,sans-serif;fill:#101828}.subtitle{font:23px 'DejaVu Sans',Arial,sans-serif;fill:#475467}.heading{font:bold 24px 'DejaVu Sans',Arial,sans-serif;fill:#152238}.label{font:bold 21px 'DejaVu Sans Mono',monospace;fill:#172033}.text{font:19px 'DejaVu Sans',Arial,sans-serif;fill:#344054}.small{font:16px 'DejaVu Sans',Arial,sans-serif;fill:#475467}
  </style><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0d8268"/></marker></defs>
  <rect class="bg" width="1500" height="900"/>
  <text x="55" y="62" class="title">TD-WTA array: four inputs plus timeout</text>
  <text x="55" y="98" class="subtitle">Five identical neuron cells; only the input current source changes</text>

  <!-- bus headings -->
  <text x="930" y="145" class="label">VRESET_REQ</text><text x="950" y="171" class="small">active low</text>
  <text x="1140" y="145" class="label">VRESET</text><text x="1155" y="171" class="small">active high</text>
  <text x="1300" y="145" class="label">VSPIKELEN</text><text x="1320" y="171" class="small">analog bias</text>
  <line x1="1000" y1="185" x2="1000" y2="720" class="wire req"/>
  <line x1="1200" y1="185" x2="1200" y2="720" class="wire rst"/>
  <line x1="1380" y1="185" x2="1380" y2="720" class="wire bias"/>

  <!-- neuron 0 -->
  <text x="55" y="245" class="label">IIN0</text><line x1="125" y1="235" x2="220" y2="235" class="wire sig" marker-end="url(#greenArrow)"/>
  <rect x="220" y="190" width="520" height="90" rx="14" class="cell"/>
  <text x="250" y="230" class="heading">XNEUR0</text><text x="390" y="230" class="small">same seven-device neuron</text>
  <text x="250" y="260" class="small">VSOMA0 -> threshold -> VSPIKE0</text>
  <line x1="740" y1="220" x2="860" y2="220" class="wire sig" marker-end="url(#greenArrow)"/><text x="755" y="205" class="label">VSPIKE0</text>
  <line x1="740" y1="245" x2="1000" y2="245" class="wire req"/><line x1="1200" y1="260" x2="740" y2="260" class="wire rst"/><line x1="1380" y1="275" x2="740" y2="275" class="wire bias"/>

  <!-- neuron 1 -->
  <text x="55" y="355" class="label">IIN1</text><line x1="125" y1="345" x2="220" y2="345" class="wire sig" marker-end="url(#greenArrow)"/>
  <rect x="220" y="300" width="520" height="90" rx="14" class="cell"/>
  <text x="250" y="340" class="heading">XNEUR1</text><text x="390" y="340" class="small">same seven-device neuron</text>
  <text x="250" y="370" class="small">VSOMA1 -> threshold -> VSPIKE1</text>
  <line x1="740" y1="330" x2="860" y2="330" class="wire sig" marker-end="url(#greenArrow)"/><text x="755" y="315" class="label">VSPIKE1</text>
  <line x1="740" y1="355" x2="1000" y2="355" class="wire req"/><line x1="1200" y1="370" x2="740" y2="370" class="wire rst"/><line x1="1380" y1="385" x2="740" y2="385" class="wire bias"/>

  <!-- neuron 2 -->
  <text x="55" y="465" class="label">IIN2</text><line x1="125" y1="455" x2="220" y2="455" class="wire sig" marker-end="url(#greenArrow)"/>
  <rect x="220" y="410" width="520" height="90" rx="14" class="cell"/>
  <text x="250" y="450" class="heading">XNEUR2</text><text x="390" y="450" class="small">same seven-device neuron</text>
  <text x="250" y="480" class="small">VSOMA2 -> threshold -> VSPIKE2</text>
  <line x1="740" y1="440" x2="860" y2="440" class="wire sig" marker-end="url(#greenArrow)"/><text x="755" y="425" class="label">VSPIKE2</text>
  <line x1="740" y1="465" x2="1000" y2="465" class="wire req"/><line x1="1200" y1="480" x2="740" y2="480" class="wire rst"/><line x1="1380" y1="495" x2="740" y2="495" class="wire bias"/>

  <!-- neuron 3 -->
  <text x="55" y="575" class="label">IIN3</text><line x1="125" y1="565" x2="220" y2="565" class="wire sig" marker-end="url(#greenArrow)"/>
  <rect x="220" y="520" width="520" height="90" rx="14" class="cell"/>
  <text x="250" y="560" class="heading">XNEUR3</text><text x="390" y="560" class="small">same seven-device neuron</text>
  <text x="250" y="590" class="small">VSOMA3 -> threshold -> VSPIKE3</text>
  <line x1="740" y1="550" x2="860" y2="550" class="wire sig" marker-end="url(#greenArrow)"/><text x="755" y="535" class="label">VSPIKE3</text>
  <line x1="740" y1="575" x2="1000" y2="575" class="wire req"/><line x1="1200" y1="590" x2="740" y2="590" class="wire rst"/><line x1="1380" y1="605" x2="740" y2="605" class="wire bias"/>

  <!-- timeout -->
  <text x="55" y="685" class="label">ITO = 5 nA</text><line x1="180" y1="675" x2="220" y2="675" class="wire sig" marker-end="url(#greenArrow)"/>
  <rect x="220" y="630" width="520" height="90" rx="14" class="timeout"/>
  <text x="250" y="670" class="heading">XNEUR_TO</text><text x="420" y="670" class="small">matched timeout neuron</text>
  <text x="250" y="700" class="small">identical circuit and loading</text>
  <line x1="740" y1="660" x2="900" y2="660" class="wire sig" marker-end="url(#greenArrow)"/><text x="755" y="645" class="label">TIMEOUT_SPIKE</text>
  <line x1="740" y1="685" x2="1000" y2="685" class="wire req"/><line x1="1200" y1="700" x2="740" y2="700" class="wire rst"/><line x1="1380" y1="715" x2="740" y2="715" class="wire bias"/>

  <!-- shared block -->
  <rect x="920" y="750" width="510" height="105" rx="16" class="shared"/>
  <text x="950" y="790" class="heading">XRESET</text>
  <text x="950" y="825" class="text">request low -> reset high -> discharge every VSOMA</text>
  <line x1="1000" y1="720" x2="1000" y2="750" class="wire req"/>
  <line x1="1200" y1="750" x2="1200" y2="720" class="wire rst"/>

  <text x="55" y="790" class="heading">Winner rule</text>
  <text x="55" y="825" class="text">Largest current -> shortest latency -> first spike.</text>
  <text x="55" y="855" class="text">If every signal is below 5 nA, XNEUR_TO wins.</text>
</svg>
